{% extends "base.html" %}

{% block content %}

<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">

    <div class="card shadow-sm">
      <div class="card-body">

        <h3 class="mb-3">
          Change Password
        </h3>

        <p class="text-muted">
          Enter your current password and choose a new
          password. You will need to log in again after
          changing it.
        </p>

        <form method="POST"
              action="{{ url_for(
                'auth.change_password'
              ) }}">

          <div class="mb-3">
            <label class="form-label">
              Current Password
              <span class="text-danger">*</span>
            </label>

            <input type="password"
                   name="current_password"
                   class="form-control"
                   autocomplete="current-password"
                   required>
          </div>

          <div class="mb-3">
            <label class="form-label">
              New Password
              <span class="text-danger">*</span>
            </label>

            <input type="password"
                   name="new_password"
                   class="form-control"
                   minlength="8"
                   autocomplete="new-password"
                   required>

            <div class="form-text">
              Password must contain at least 8 characters.
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label">
              Confirm New Password
              <span class="text-danger">*</span>
            </label>

            <input type="password"
                   name="confirm_password"
                   class="form-control"
                   minlength="8"
                   autocomplete="new-password"
                   required>
          </div>

          <button type="submit"
                  class="btn btn-primary">
            Change Password
          </button>

          <a href="{{ url_for(
              'learners.select_college'
            ) }}"
             class="btn btn-secondary">
            Cancel
          </a>

        </form>

      </div>
    </div>

  </div>
</div>

{% endblock %}

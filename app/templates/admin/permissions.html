{% extends 'base.html' %}
{% block content %}
<h3>User × College Permissions</h3>
<form method="post" class="card card-body mb-4">
  <div class="row g-2 align-items-end">
    <div class="col">
  <label>User</label>
  <select name="user_id" class="form-select" required>
    {% if users %}
      {% for u in users %}
        <option value="{{ u.id }}">
          {{ u.full_name }} - {{ u.email }}
        </option>
      {% endfor %}
    {% else %}
      <option value="">No active enrolment/placement users found</option>
    {% endif %}
  </select>
</div>
    <div class="col"><label>College</label><select name="college_id" class="form-select">{% for c in colleges %}<option value="{{ c.id }}">{{ c.institute_name }}</option>{% endfor %}</select></div>
    <div class="col-auto"><label><input type="checkbox" name="can_view" checked> View</label></div>
    <div class="col-auto"><label><input type="checkbox" name="can_add"> Add</label></div>
    <div class="col-auto"><label><input type="checkbox" name="can_edit"> Edit</label></div>
    <div class="col-auto"><label><input type="checkbox" name="can_delete"> Delete</label></div>
    <div class="col-auto"><button class="btn btn-primary">Save</button></div>
  </div>
</form>
<table class="table table-bordered table-sm"><thead><tr><th>User</th><th>College</th><th>View</th><th>Add</th><th>Edit</th><th>Delete</th></tr></thead><tbody>
{% for p in perms %}<tr><td>{{ p.user.full_name }}</td><td>{{ p.college.institute_name }}</td><td>{{ p.can_view }}</td><td>{{ p.can_add }}</td><td>{{ p.can_edit }}</td><td>{{ p.can_delete }}</td></tr>{% endfor %}
</tbody></table>
{% endblock %}

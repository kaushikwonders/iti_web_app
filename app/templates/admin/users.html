{% extends 'base.html' %}
{% block content %}
<h3>Users</h3>
<form method="post" class="card card-body mb-4">
  <div class="row g-2">
    <div class="col"><input name="full_name" class="form-control" placeholder="Full name" required></div>
    <div class="col"><input name="email" type="email" class="form-control" placeholder="Email" required></div>
    <div class="col"><input name="password" type="password" class="form-control" placeholder="Password" required></div>
    <div class="col"><select name="role_id" class="form-select">{% for r in roles %}<option value="{{ r.id }}">{{ r.role_name }}</option>{% endfor %}</select></div>
    <div class="col"><input name="start_date" type="date" class="form-control"></div>
    <div class="col"><input name="expiry_date" type="date" class="form-control"></div>
    <div class="col-auto form-check mt-2"><input name="is_active" class="form-check-input" type="checkbox" checked> Active</div>
    <div class="col-auto"><button class="btn btn-primary">Create</button></div>
  </div>
</form>
<table class="table table-bordered table-sm"><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Active</th><th></th></tr></thead><tbody>
{% for u in users %}<tr><td>{{ u.full_name }}</td><td>{{ u.email }}</td><td>{{ u.role.role_name }}</td><td>{{ u.is_active }}</td><td><a class="btn btn-sm btn-outline-primary" href="{{ url_for('admin.edit_user', user_id=u.id) }}">Edit</a></td></tr>{% endfor %}
</tbody></table>
{% endblock %}

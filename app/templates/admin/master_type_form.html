{% extends "base.html" %}

{% block content %}

<h3>Add New Master</h3>

<div class="card">
  <div class="card-body">

    <form method="POST">

      <div class="mb-3">
        <label class="form-label">Master Name</label>
        <input type="text"
               name="master_name"
               class="form-control"
               placeholder="Example: Gender"
               required>
      </div>

      <div class="mb-3">
        <label class="form-label">Master Key</label>
        <input type="text"
               name="master_key"
               class="form-control"
               placeholder="Example: gender"
               required>

        <small class="text-muted">
          Use lowercase and underscore only. Example: trade_course, course_completion_status
        </small>
      </div>

      <div class="mb-3">
        <label class="form-label">Description</label>
        <textarea name="description"
                  class="form-control"
                  rows="3"></textarea>
      </div>

      <button type="submit" class="btn btn-primary">Save Master</button>
      <a href="{{ url_for('admin.masters') }}" class="btn btn-secondary">Cancel</a>

    </form>

  </div>
</div>

{% endblock %}
